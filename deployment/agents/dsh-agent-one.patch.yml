# dsh-agent-one 部署补丁：一体化主智能体（自包含 pm/cto/dev）
#
# 复用现有 echuan 平台，不另起平台；profile 独立、relay 端口独立。
# worker.poll 默认关闭：dsh-agent 与 one 声明同样的 kinds，同时开心跳会抢卡。
# 测试派单流程时，先暂停 dsh-agent，再把下面的 poll.enable 改成 true。
- id: agent-preset-registry
  config:
    default: one

- id: echuan
  config:
    baseUrl: http://echuan:8720
    actor: agent_core:one
    requestTimeoutMs: 35000
    exclude: []
    worker:
      poll:
        enable: false
      presetByKind:
        requirement: one
        design: one
        breakdown: one
        dev: one
      # 一个项目一个会话：主 agent 持有项目全貌，角色差异交给子智能体 preset
      sessionKey: project
      metadata:
        host: one-01
        os: darwin
        agent_version: 0.2.1
        name: one
