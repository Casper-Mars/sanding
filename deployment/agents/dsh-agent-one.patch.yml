# dsh-agent-one 部署补丁：一体化主智能体（自包含 pm/cto/dev）
#
# 复用现有 echuan 平台，不另起平台；profile 独立、relay 端口独立。
# worker.poll 开启：dsh-agent 与 one 声明同样的 kinds，同时开心跳会抢卡，
# 所以本机唯一领卡方是 one（dsh-agent 的 poll 已关闭）。
- id: agent-preset-registry
  config:
    default: one

- id: echuan
  config:
    baseUrl: http://echuan:8720
    actor: agent_core:one
    requestTimeoutMs: 35000
    exclude: []
    worker:
      poll:
        enable: true
      presetByKind:
        requirement: one
        design: one
        breakdown: one
        dev: one
      # 一个项目一个会话：主 agent 持有项目全貌，角色差异交给子智能体 preset
      sessionKey: project
      metadata:
        host: one-01
        os: darwin
        agent_version: 0.2.1
        name: one

# dsh-relay：bundle 层已有 insert id=relay，这里只做 config 覆盖（会整行替换 config，
# 需要的字段必须全部重述）。手机经 xedge 组网访问时 Host 头是 100.64.0.1，
# relay 的 fence 只放行 loopback + publicHostnames，否则 403 untrusted-host。
- id: relay
  config:
    stateDir: !!js dshHomePath('relay')
    bind: '0.0.0.0'
    port: 3443
    tls: self-signed
    publicHostnames:
      - 100.64.0.1
    compat:
      addressGrants: true
      addressGrantTtlMs: 86400000
      plainPort: 0
