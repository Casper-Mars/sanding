# 三鼎（sanding）交付系统 —— 统一部署编排
#
# 六个服务，对应架构文档 v3.5 的执行单元 + 一个共享浏览器 + 一个 Web 控制面：
#   echuan      驿传平台（协调面）：需求 / 方案 / 任务 / 交付 / 待办 / 审计
#   cto-agent   CTO Agent：dsh-agent-base 镜像 + dsh-agent-cto 插件组
#   dev-agent   开发 Agent：dsh + dsh-agent-dev + dsh-echuan（含 docker / devcontainer）
#   pm-agent    产品经理 Agent：同一个 dsh-agent-base 镜像 + dsh-agent-pm 插件组
#   browserless 无头 Chromium：供 agent / 客户端经 CDP(WS) 或 HTTP 调用
#   dsh-control-plane  Web 控制面：把三个 Agent 收进同一个 UI（实例表挂载注入）
#
# 浏览器说明：0.2.0 起直接使用官方镜像 ghcr.io/browserless/chromium，
# 不再自建带 stagehand extension 的镜像（扩展已弃用，无需 --load-extension）。
#
# 源码：两个镜像都在本仓库 agents/（dsh-agent-base 供 cto+pm 共用、dsh-agent-dev）。
# cto 与 pm 的镜像完全相同，差异只在 PLUGIN_SPECS；compose 会复用同一次构建。
# 插件一律不挂宿主目录：启动时按 DSH_*_PLUGIN_SPECS 从 npm registry 安装。
#
# 常用命令：
#   cp .env.example .env && vi .env        # 首次：填路径
#   docker compose up -d                   # 启动（镜像已存在则不再构建）
#   docker compose up -d --build           # 强制重建镜像
#   docker compose ps
#   docker compose logs -f --tail=100 cto-agent
#   docker compose down
#
# 约定：
#   - compose 项目名统一为 sanding；容器名沿用 echuan-v2 / dsh-agent-base / dsh-agent-dev，
#     与既有运维脚本、宿主工具保持一致。
#   - 所有端口只绑 127.0.0.1，公网入口放宿主机反向代理。
#   - cto-agent 与 echuan 的跨容器通道走 compose 内部网络（服务名 echuan:8720）；
#     agent 侧默认仍按 dsh-home 里的 cordis.patch.yml 走 host.docker.internal:8721。

name: ${COMPOSE_PROJECT_NAME:-sanding}

# ── 复用片段 ────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-agent-security-opt: &agent-security-opt
  - seccomp=unconfined
  - apparmor=unconfined

x-agent-cap: &agent-cap
  - SYS_ADMIN

x-agent-healthcheck: &agent-healthcheck
  test:
    - CMD-SHELL
    - >-
      node -e "const os=require('os');const ip=Object.values(os.networkInterfaces()).flat().find(i=>i.family==='IPv4'&&!i.internal).address;require('http').get({host:ip,port:3080,path:'/'},r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

# 两个 agent 共用的环境变量
x-agent-env: &agent-env
  DSH_HOME: /home/node/.dsh
  DSH_PROFILE: ${DSH_PROFILE:-web}
  # 项目路径：devcontainer CLI 的 --workspace-folder
  HOST_PROJECT_PATH: ${HOST_PROJECT_PATH:?请在 .env 中设置项目绝对路径}
  # 内网 / 宿主地址一律直连：驿传平台在宿主 127.0.0.1:8721（仅回环发布），
  # 只能经 host.docker.internal / 192.168.65.254 访问，不能过代理。
  NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,192.168.65.254,echuan,m.daocloud.io
  no_proxy: localhost,127.0.0.1,::1,host.docker.internal,192.168.65.254,echuan,m.daocloud.io
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
  # GitHub PAT（.env 里配置；留空 = 容器内 gh 未登录）
  GH_PAT_TOKEN: ${GH_TOKEN:-}
  # LLM 凭据：环境层优先级最高、只读，Web 设置页无法覆盖
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

services:
  # ── 驿传平台 ──────────────────────────────────────────────────────────────
  echuan:
    image: ${ECHUAN_IMAGE:-echuan:local}
    build:
      context: ${ECHUAN_SRC:-../../echuan_v2}
      dockerfile: Dockerfile
      args:
        VERSION: ${ECHUAN_VERSION:-dev}
        COMMIT: ${ECHUAN_COMMIT:-none}
        # 构建期依赖源（默认值即国内镜像；切回官方见 echuan 仓库 docs/deploy.md 第 3.5 节）
        GOPROXY: ${DOCKER_BUILD_GOPROXY:-https://goproxy.cn,https://proxy.golang.org,direct}
        NPM_REGISTRY: ${DOCKER_BUILD_NPM_REGISTRY:-https://registry.npmmirror.com}
        APK_MIRROR: ${DOCKER_BUILD_APK_MIRROR:-mirrors.aliyun.com}
        IMAGE_MIRROR: ${DOCKER_BUILD_IMAGE_MIRROR:-}
        NODE_IMAGE: ${DOCKER_BUILD_NODE_IMAGE:-node:22-alpine}
        GO_IMAGE: ${DOCKER_BUILD_GO_IMAGE:-golang:1.26-alpine}
        RUNTIME_IMAGE: ${DOCKER_BUILD_RUNTIME_IMAGE:-alpine:3.20}
        # Docker Desktop 会把全局代理注入构建容器。默认清空（直连），
        # 需要代理的环境在 .env 里设置 DOCKER_BUILD_*_PROXY。
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
        http_proxy: ${DOCKER_BUILD_HTTP_PROXY:-}
        https_proxy: ${DOCKER_BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${DOCKER_BUILD_ALL_PROXY:-}
        all_proxy: ${DOCKER_BUILD_ALL_PROXY:-}
    container_name: ${ECHUAN_CONTAINER_NAME:-echuan}
    restart: unless-stopped

    # 宿主 8721 → 容器 8720（容器内监听地址固定，端口隔离只在部署层做）
    ports:
      - "127.0.0.1:${ECHUAN_PORT:-8721}:8720"

    # 默认 UID/GID 10001；Linux 宿主机请让数据目录属主与其一致。
    user: "${ECHUAN_UID:-10001}:${ECHUAN_GID:-10001}"

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 留空时配置文件生效；非空时覆盖 TOML（ECHUAN_* 优先级最高）
      ECHUAN_LOG_LEVEL: ${ECHUAN_LOG_LEVEL:-}
      # 飞书机器人（可选模块）。enabled=false 时平台行为与接入前完全一致。
      ECHUAN_IM_ENABLED: ${ECHUAN_IM_ENABLED:-false}
      ECHUAN_IM_APP_ID: ${ECHUAN_IM_APP_ID:-}
      ECHUAN_IM_APP_SECRET: ${ECHUAN_IM_APP_SECRET:-}
      ECHUAN_IM_CHAT_IDS: ${ECHUAN_IM_CHAT_IDS:-}
      ECHUAN_IM_DOC_FOLDER: ${ECHUAN_IM_DOC_FOLDER:-}

    volumes:
      # 数据库 / objects / workspaces 全部落在宿主机目录，删容器不丢数据
      - "${ECHUAN_DATA_DIR:-./echuan/data}:/data"
      # 配置只读挂载；部署侧真相源在 deployment/echuan/
      - "${ECHUAN_CONFIG_FILE:-./echuan/echuan.container.toml}:/etc/echuan/echuan.toml:ro"

    networks:
      - sanding

    logging: *default-logging

    # 探针前用 env -u 剥离代理变量：Docker Desktop 会把宿主代理注入容器，
    # busybox wget 走代理且不认 NO_PROXY，会把 127.0.0.1 的健康检查打成 502。
    healthcheck:
      test:
        - CMD
        - env
        - -u
        - HTTP_PROXY
        - -u
        - HTTPS_PROXY
        - -u
        - ALL_PROXY
        - -u
        - http_proxy
        - -u
        - https_proxy
        - -u
        - all_proxy
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8720/readyz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ── 无头浏览器（browserless 官方 Chromium 镜像）───────────────────────────
  # 只读调用方：agent 容器经 http://host.docker.internal:3001?token=... 访问，
  # 宿主侧经 http://127.0.0.1:3001 访问；不对外网暴露。
  browserless:
    # 生产环境建议固定 tag 或 digest（例如 ghcr.io/browserless/chromium:2.13.0@sha256:...）
    image: ${BROWSERLESS_IMAGE:-ghcr.io/browserless/chromium:latest}
    container_name: browserless
    restart: unless-stopped
    ports:
      # 只绑回环；宿主 3001 → 容器 3000（避开宿主常见的 3000 占用）
      - "127.0.0.1:${BROWSERLESS_PORT:-3000}:3000"
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?请在 .env 中设置 BROWSERLESS_TOKEN（openssl rand -hex 32）}
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-3}
      QUEUED: ${BROWSERLESS_QUEUED:-5}
      TIMEOUT: ${BROWSERLESS_TIMEOUT:-60000}
      TZ: ${TZ:-Asia/Shanghai}
      # 不设置 CHROME_FLAGS / --load-extension：stagehand 扩展已弃用
    shm_size: "${BROWSERLESS_SHM_SIZE:-2g}"
    volumes:
      # 浏览器用户数据 / 下载 / 指标落盘，删容器不丢
      - "${BROWSERLESS_DATA_DIR:-./data/browserless}:/data"
    networks:
      - sanding
    logging: *default-logging
    # 用镜像自带 curl 探 /pressure（官方推荐的健康端点；镜像内 curl/wget 都有）。
    # browserless 所有端点都鉴权，令牌由 compose 在解析期从 .env 代入；
    # 若想改成 /json/version，同样需要带 token。
    #
    # 健康判定：只要拿到 HTTP 响应就算活着。200 = 空闲；429 = 实例健康但
    # 已达并发上限（busy），不应判死。000（连不上）/ 5xx 才算失败。
    # 注意：compose 里 shell 变量需写 $$，${BROWSERLESS_TOKEN} 仍由解析期代入。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/pressure?token=${BROWSERLESS_TOKEN}" || true); [ "$$code" = "200" ] || [ "$$code" = "429" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── CTO Agent ────────────────────────────────────────────────────────────
  cto-agent:
    # 与 pm-agent 同一个镜像，角色由 PLUGIN_SPECS 决定
    image: ${DSH_AGENT_IMAGE:-dsh-agent-base:local}
    build:
      context: ${DSH_AGENT_SRC:-../agents/dsh-agent-base}
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
    container_name: ${DSH_CTO_CONTAINER_NAME:-dsh-agent-cto}
    restart: unless-stopped
    depends_on:
      echuan:
        condition: service_healthy
      browserless:
        condition: service_healthy
    # 让容器用 host.docker.internal 访问宿主服务（驿传平台）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DSH_CTO_PORT:-8090}:3080"
    volumes:
      # 插件不挂宿主目录：启动时按 DSH_CTO_PLUGIN_SPECS 从 npm registry 安装
      # 项目 / 工作区：agent 与宿主共享同一份数据
      - "${HOST_PROJECT_PATH:?请在 .env 中设置项目绝对路径}:/workspace"
      # dsh home：profile / 会话 / cordis.patch.yml 由用户直接编辑
      - "${DSH_CTO_HOME_DIR:-./data/dsh-home-cto}:/home/node/.dsh"
      # 部署补丁层（home patch）：优先级高于 Web 设置页，只读挂载
      - "./agents/cto.patch.yml:/home/node/.dsh/cordis.patch.yml:ro"
    security_opt: *agent-security-opt
    cap_add: *agent-cap
    environment:
      <<: *agent-env
      # 插件清单：空格分隔的 <name>@<exact-version>，顺序即安装顺序
      # 镜像入口统一读 PLUGIN_SPECS；这里把服务级变量映射过去，便于 .env 里分开配置
      PLUGIN_SPECS: ${DSH_CTO_PLUGIN_SPECS:-dsh-agent-cto@0.1.0 dsh-echuan@0.2.1 dsh-agent-base@0.1.0 dsh-browser-native@0.1.0}
    networks:
      - sanding
    logging: *default-logging
    healthcheck: *agent-healthcheck

  # ── 开发 Agent ───────────────────────────────────────────────────────────
  dev-agent:
    image: ${DSH_DEV_IMAGE:-dsh-agent-dev:local}
    build:
      context: ${DSH_DEV_SRC:-../agents/dsh-agent-dev}
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
        GH_VERSION: ${GH_VERSION:-2.95.0}
        # 构建期下载 gh 需要出网；留空则沿用 Docker Desktop 注入的构建代理
        GH_PROXY: ${DOCKER_PROXY:-}
    container_name: ${DSH_DEV_CONTAINER_NAME:-dsh-agent-dev}
    restart: unless-stopped
    depends_on:
      echuan:
        condition: service_healthy
      # browserless 是 dev-agent 的运行时依赖：agent 通过 CDP/HTTP 调用它。
      # service_healthy 依赖 browserless 的 healthcheck（200/429 均判健康）。
      browserless:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DSH_DEV_PORT:-8091}:3080"
    volumes:
      # 宿主 Docker socket：docker CLI / devcontainer CLI 指挥宿主 daemon
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
      # 插件不挂宿主目录：启动时按 PLUGIN_SPECS 从 npm registry 安装
      # 项目 / 工作区：agent 与工具容器共享同一份数据
      - "${HOST_PROJECT_PATH:?请在 .env 中设置项目绝对路径}:/workspace"
      # dsh home：profile / 会话 / cordis.patch.yml 由用户直接编辑
      - "${DSH_DEV_HOME_DIR:-./data/dsh-home-dev}:/home/node/.dsh"
      # 部署补丁层（home patch）：优先级高于 Web 设置页，只读挂载
      - "./agents/dev.patch.yml:/home/node/.dsh/cordis.patch.yml:ro"
    security_opt: *agent-security-opt
    cap_add: *agent-cap
    environment:
      <<: *agent-env
      # 插件清单：空格分隔的 <name>@<exact-version>，顺序即安装顺序
      PLUGIN_SPECS: ${DSH_DEV_PLUGIN_SPECS:-dsh-agent-dev@0.2.0 dsh-echuan@0.2.1 dsh-agent-base@0.1.0 dsh-browser-native@0.1.0}
      # devcontainer CLI 查询海外 registry（ghcr.io）的 features 清单需要代理。
      # 注意：Docker Desktop 会把宿主 shell 的【小写】代理变量注入容器，且小写
      # no_proxy 不含 host.docker.internal；插件 HTTP 客户端读小写变量，会把访问
      # 驿传平台的请求发给代理 → 502。所以大小写必须成对显式覆盖。
      HTTP_PROXY: ${DOCKER_PROXY:-}
      HTTPS_PROXY: ${DOCKER_PROXY:-}
      ALL_PROXY: ${DOCKER_PROXY:-}
      http_proxy: ${DOCKER_PROXY:-}
      https_proxy: ${DOCKER_PROXY:-}
      all_proxy: ${DOCKER_PROXY:-}
    networks:
      - sanding
    logging: *default-logging
    healthcheck: *agent-healthcheck

  # ── 产品经理 Agent ────────────────────────────────────────────────────────
  pm-agent:
    # 与 cto-agent 同一个镜像，角色由 PLUGIN_SPECS 决定
    image: ${DSH_AGENT_IMAGE:-dsh-agent-base:local}
    build:
      context: ${DSH_AGENT_SRC:-../agents/dsh-agent-base}
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
    container_name: ${DSH_PM_CONTAINER_NAME:-dsh-agent-pm}
    restart: unless-stopped
    depends_on:
      echuan:
        condition: service_healthy
      browserless:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DSH_PM_PORT:-8093}:3080"
    volumes:
      # 插件不挂宿主目录：启动时按 PLUGIN_SPECS 从 npm registry 安装
      # 项目 / 工作区：agent 与宿主共享同一份数据
      - "${HOST_PROJECT_PATH:?请在 .env 中设置项目绝对路径}:/workspace"
      # dsh home：profile / 会话 / cordis.patch.yml 由用户直接编辑
      - "${DSH_PM_HOME_DIR:-./data/dsh-home-pm}:/home/node/.dsh"
      # 部署补丁层（home patch）：优先级高于 Web 设置页，只读挂载
      - "./agents/pm.patch.yml:/home/node/.dsh/cordis.patch.yml:ro"
    security_opt: *agent-security-opt
    cap_add: *agent-cap
    environment:
      <<: *agent-env
      PLUGIN_SPECS: ${DSH_PM_PLUGIN_SPECS:-dsh-agent-pm@0.1.0 dsh-echuan@0.2.1 dsh-agent-base@0.1.0 dsh-browser-native@0.1.0}
    networks:
      - sanding
    logging: *default-logging
    healthcheck: *agent-healthcheck

  # ── 合并 Host（单 Host 多角色，V3 目标形态）────────────────────────────────
  # 三个角色包装进同一个 profile：技能在各自 preset 层、persona 按 preset id 门控。
  # 保留旧三台作为回退，验收通过后（任务-10）再删。
  dsh-agent:
    image: ${DSH_MERGED_IMAGE:-dsh-agent-dev:local}
    container_name: ${DSH_MERGED_CONTAINER_NAME:-dsh-agent}
    restart: unless-stopped
    depends_on:
      echuan:
        condition: service_healthy
      browserless:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 与旧三台（8090/8091/8093）错开，便于并存回退
      - "127.0.0.1:${DSH_MERGED_PORT:-8095}:3080"
    volumes:
      # dev 的角色需要指挥宿主 daemon（ADR-5：同进程特权，靠权限档位与红线约束）
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${HOST_PROJECT_PATH:?请在 .env 中设置项目绝对路径}:/workspace"
      - "${DSH_MERGED_HOME_DIR:-./data/dsh-home-agent}:/home/node/.dsh"
      # 部署补丁层：覆盖 registry.default = cto，并声明 worker 承接全部 kind
      - "./patches/dsh-agent.patch.yml:/home/node/.dsh/cordis.patch.yml:ro"
      # 验收脚本（只读）：docker compose exec dsh-agent node /opt/verify-presets.mjs
      - "../scripts/verify-presets.mjs:/opt/verify-presets.mjs:ro"
    security_opt: *agent-security-opt
    cap_add: *agent-cap
    environment:
      <<: *agent-env
      PLUGIN_SPECS: ${DSH_MERGED_PLUGIN_SPECS:-dsh-agent-cto@0.5.2 dsh-agent-pm@0.5.0 dsh-agent-dev@0.7.0 dsh-echuan@0.2.2 dsh-agent-base@0.2.0 dsh-browser-native@0.1.0 dsh-local-admission@0.1.1}
      # 大小写代理变量必须成对覆盖：插件 HTTP 客户端读小写变量，
      # 注入的宿主代理会把访问驿传平台的请求转走 → 502。
      HTTP_PROXY: ${DOCKER_PROXY:-}
      HTTPS_PROXY: ${DOCKER_PROXY:-}
      ALL_PROXY: ${DOCKER_PROXY:-}
      http_proxy: ${DOCKER_PROXY:-}
      https_proxy: ${DOCKER_PROXY:-}
      all_proxy: ${DOCKER_PROXY:-}
    networks:
      - sanding
    logging: *default-logging
    healthcheck: *agent-healthcheck

  # ── 统一入口（官方 UI，零改造）────────────────────────────────────────────
  # 三个子域各自反代到一台 Agent 的官方 dsh web；每个子域都是根路径，
  # 不改写任何 /api 或 WebSocket 路径。门户页由同一端口的默认站点提供。
  # 为什么不用路径前缀（/cto/）：dsh web 的资源与 API 都是绝对路径，前缀会踩坑。
  dsh-portal:
    image: ${DSH_PORTAL_IMAGE:-caddy:2-alpine}
    container_name: ${DSH_PORTAL_CONTAINER_NAME:-dsh-portal}
    restart: unless-stopped
    depends_on:
      - dsh-agent
    ports:
      # 只绑回环：本机入口，公网暴露仍交给隧道 / 反代
      - "127.0.0.1:${DSH_PORTAL_PORT:-8080}:80"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./portal:/srv:ro"
      - "${DSH_PORTAL_DATA_DIR:-./data/caddy}:/data"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Docker Desktop 会把宿主机代理注入每个容器；不绕过就会把 cto-agent:3080
      # 当成外网请求交给代理，回 502。内部服务一律直连。
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,dsh-agent
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal,dsh-agent
    networks:
      - sanding
    logging: *default-logging

  # ── Web 控制面（实验，冻结在 2026-11-14）───────────────────────────────────
  # 复用官方 dsh CLI + 本仓库构建的 control-plane bundle（不改 CLI）。
  # 冻结说明：控制面靠 fork 官方 UI 换来多 Agent 聚合，上游升级要持续跟；
  # 2026-11-14 起改走 dsh-portal（Caddy 子域 + 官方 UI），本服务仅保留供对比，不再迭代。
  # 容器内只监听 127.0.0.1:3080；宿主端口仅绑回环，对外入口由接入方案（relay / xEdge）负责。
  # 实例表只读挂载：改完 control-plane/control-plane.json 后 docker compose up -d 生效。
  dsh-control-plane:
    image: ${DSH_CONTROL_PLANE_IMAGE:-dsh-control-plane:local}
    build:
      context: ${DSH_CONTROL_PLANE_SRC:-../../dsh-web-control}
      dockerfile: ${DSH_CONTROL_PLANE_DOCKERFILE:-Dockerfile.slim}
      args:
        DSH_CLIENT_COMMIT_HASH: ${DSH_CONTROL_PLANE_COMMIT:-0000000}
        # 构建期用公共源：宿主 .env 的 NPM_REGISTRY 指向本地 verdaccio，构建容器不一定能访问
        NPM_REGISTRY: ${DSH_CONTROL_PLANE_NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ${DSH_CONTROL_PLANE_CONTAINER_NAME:-dsh-control-plane}
    restart: unless-stopped
    depends_on:
      - cto-agent
      - dev-agent
      - pm-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # harness 只绑 loopback（relay 要求），对外入口是 relay 的 3443。
    # 要临时在本机直连 harness，可把 DSH_CONTROL_PLANE_BIND 改为 auto 并加 3095:3080 发布。
    ports:
      - "${DSH_CONTROL_PLANE_RELAY_PORT:-3443}:3443"
    volumes:
      # dsh home：profile / 会话 / 凭据 / 日志
      - "${DSH_CONTROL_PLANE_HOME_DIR:-./data/dsh-home-cp}:/home/node/.dsh"
      # 实例表：容器间用服务名寻址
      - "./control-plane/control-plane.json:/etc/dsh/control-plane.json:ro"
      # relay 插件挂载：profile patch 层
      - "./control-plane/cordis.patch.yml:/home/node/.dsh/profiles/web/cordis.patch.yml:ro"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # auto = 绑容器 eth0 IP（可 publish）；loopback = 供 relay 前置
      DSH_BIND_HOST: ${DSH_CONTROL_PLANE_BIND:-loopback}
      # 运行期插件安装源（relay 在 entrypoint 里装，不进镜像）
      NPM_REGISTRY: ${DSH_CONTROL_PLANE_NPM_REGISTRY:-https://registry.npmmirror.com}
      # relay 插件版本：运行期安装，升级只改这里或 .env，无需重建镜像
      DSH_RELAY_PLUGIN: ${DSH_RELAY_PLUGIN:-dsh-relay@0.4.0}
      # 容器间直连，不能过代理
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,cto-agent,dev-agent,pm-agent
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal,cto-agent,dev-agent,pm-agent
    networks:
      - sanding
    logging: *default-logging
    healthcheck:
      # 无 token 访问返回 401，属于「健康」；只校验端口有 HTTP 应答
      test:
        - CMD-SHELL
        - >-
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ | grep -qE '^(200|302|303|401)$'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  sanding:
    name: sanding
    driver: bridge
