# 三鼎（sanding）交付系统 —— 统一部署编排
#
# 三个服务：
#   echuan      驿传平台（协调面）：需求 / 方案 / 任务 / 交付 / 待办 / 审计
#   dsh-agent   合并 Host：dsh-agent-cto / dsh-agent-pm / dsh-agent-dev 三个角色包
#               装进同一个 profile，技能按 preset 隔离；对外只经运行期安装的
#               dsh-relay（TLS + 密码 + 设备配对），harness 本身只绑回环
#   browserless 无头 Chromium：供 agent / 客户端经 CDP(WS) 或 HTTP 调用
#   smee         smee.io 中继客户端：把 GitHub webhook 送进 dsh-agent 的 /github
#
# 浏览器：0.2.0 起直接用官方镜像 ghcr.io/browserless/chromium，不加载 extension。
# 插件：一律不挂宿主目录，启动时按 PLUGIN_SPECS 从 npm registry 安装。
#
# 常用命令：
#   cp .env.example .env && vi .env
#   ./scripts/up.sh                # 启动并等 healthy（--build 重建镜像）
#   ./scripts/status.sh            # 容器状态 + 端口探活 + worker
#   ./scripts/smoke-test.sh        # 冒烟
#   ./scripts/down.sh              # 停止（数据保留）
#
# 端口约定：echuan 绑 127.0.0.1 + xedge 隧道地址（ECHUAN_BIND / ECHUAN_BIND_ALT）；
# browserless 只绑 127.0.0.1；agent 对外入口只有 dsh-relay:3443。

name: ${COMPOSE_PROJECT_NAME:-sanding}

# ── 复用片段 ────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-agent-security-opt: &agent-security-opt
  - seccomp=unconfined
  - apparmor=unconfined

x-agent-cap: &agent-cap
  - SYS_ADMIN

# agent 环境变量
x-agent-env: &agent-env
  DSH_HOME: /home/node/.dsh
  DSH_PROFILE: ${DSH_PROFILE:-web}
  # 项目路径：devcontainer CLI 的 --workspace-folder
  HOST_PROJECT_PATH: ${HOST_PROJECT_PATH:?请在 .env 中设置项目绝对路径}
  # 内网 / 宿主地址一律直连：驿传平台在宿主 127.0.0.1:8721（仅回环发布），
  # 只能经 host.docker.internal 访问，不能过代理。
  NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,192.168.65.254,echuan,browserless,dsh-agent
  DSH_BROWSER_CDP_URL: "ws://host.docker.internal:${BROWSERLESS_PORT:-3000}/?token=${BROWSERLESS_TOKEN}&--no-proxy-server"
  no_proxy: localhost,127.0.0.1,::1,host.docker.internal,192.168.65.254,echuan,browserless,dsh-agent
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
  # GitHub PAT（.env 里配置；留空 = 容器内 gh 未登录）
  GH_PAT_TOKEN: ${GH_TOKEN:-}
  # LLM 凭据：环境层优先级最高、只读，Web 设置页无法覆盖
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

services:
  # ── 驿传平台 ──────────────────────────────────────────────────────────────
  echuan:
    # 镜像来自阿里云 ACR（GitHub Actions 在 main 合并后构建并推送双架构 latest）。
    # 私有仓库：宿主机需先 docker login 一次，见 README「镜像来源」。
    # 需要改本地代码即部署时，用本地构建覆盖层：
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml build echuan
    image: ${ECHUAN_IMAGE:-registry.cn-hangzhou.aliyuncs.com/sanding/echuan:latest}
    container_name: ${ECHUAN_CONTAINER_NAME:-echuan}
    restart: unless-stopped

    # 宿主 8721 → 容器 8720（容器内监听地址固定，端口隔离只在部署层做）
    # ECHUAN_BIND 默认回环；需要手机经 xedge 访问时设为 100.64.0.1（只对该 overlay 暴露）
    ports:
      - "${ECHUAN_BIND:-127.0.0.1}:${ECHUAN_PORT:-8721}:8720"
      # 第二个宿主地址（默认 xedge 隧道），让手机与本地同时可达
      - "${ECHUAN_BIND_ALT:-100.64.0.1}:${ECHUAN_PORT:-8721}:8720"

    # 默认 UID/GID 10001；Linux 宿主机请让数据目录属主与其一致。
    user: "${ECHUAN_UID:-10001}:${ECHUAN_GID:-10001}"

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 留空时配置文件生效；非空时覆盖 TOML（ECHUAN_* 优先级最高）
      ECHUAN_LOG_LEVEL: ${ECHUAN_LOG_LEVEL:-}
      # 飞书机器人（可选模块）。enabled=false 时平台行为与接入前完全一致。
      ECHUAN_IM_ENABLED: ${ECHUAN_IM_ENABLED:-false}
      ECHUAN_IM_APP_ID: ${ECHUAN_IM_APP_ID:-}
      ECHUAN_IM_APP_SECRET: ${ECHUAN_IM_APP_SECRET:-}
      ECHUAN_IM_CHAT_IDS: ${ECHUAN_IM_CHAT_IDS:-}
      ECHUAN_IM_DOC_FOLDER: ${ECHUAN_IM_DOC_FOLDER:-}

    volumes:
      # 数据库 / objects / workspaces 全部落在宿主机目录，删容器不丢数据
      - "${ECHUAN_DATA_DIR:-./echuan/data}:/data"
      # 配置只读挂载；部署侧真相源在 deployment/echuan/
      - "${ECHUAN_CONFIG_FILE:-./echuan/echuan.container.toml}:/etc/echuan/echuan.toml:ro"

    networks:
      - sanding

    logging: *default-logging

    # 探针前用 env -u 剥离代理变量：Docker Desktop 会把宿主代理注入容器，
    # busybox wget 走代理且不认 NO_PROXY，会把 127.0.0.1 的健康检查打成 502。
    healthcheck:
      test:
        - CMD
        - env
        - -u
        - HTTP_PROXY
        - -u
        - HTTPS_PROXY
        - -u
        - ALL_PROXY
        - -u
        - http_proxy
        - -u
        - https_proxy
        - -u
        - all_proxy
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8720/readyz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ── 无头浏览器（browserless 官方 Chromium 镜像）───────────────────────────
  # 只读调用方：agent 容器经 http://host.docker.internal:3001?token=... 访问，
  # 宿主侧经 http://127.0.0.1:3001 访问；不对外网暴露。
  browserless:
    # 生产环境建议固定 tag 或 digest（例如 ghcr.io/browserless/chromium:2.13.0@sha256:...）
    image: ${BROWSERLESS_IMAGE:-ghcr.io/browserless/chromium:latest}
    container_name: browserless
    restart: unless-stopped
    ports:
      # 只绑回环；宿主 3001 → 容器 3000（避开宿主常见的 3000 占用）
      - "127.0.0.1:${BROWSERLESS_PORT:-3000}:3000"
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?请在 .env 中设置 BROWSERLESS_TOKEN（openssl rand -hex 32）}
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-3}
      QUEUED: ${BROWSERLESS_QUEUED:-5}
      TIMEOUT: ${BROWSERLESS_TIMEOUT:-60000}
      TZ: ${TZ:-Asia/Shanghai}
      # Chrome 在容器里必须直连内网，不能走宿主代理；--no-proxy-server 由 CDP URL 传入。
      NO_PROXY: "localhost,127.0.0.1,::1,host.docker.internal,echuan,browserless,dsh-agent"
      no_proxy: "localhost,127.0.0.1,::1,host.docker.internal,echuan,browserless,dsh-agent"
    shm_size: "${BROWSERLESS_SHM_SIZE:-2g}"
    volumes:
      # 浏览器用户数据 / 下载 / 指标落盘，删容器不丢
      - "${BROWSERLESS_DATA_DIR:-./data/browserless}:/data"
    networks:
      - sanding
    logging: *default-logging
    # 用镜像自带 curl 探 /pressure（官方推荐的健康端点）。
    # 200 = 空闲；429 = 实例健康但已达并发上限（busy），不应判死。
    # 注意：compose 里 shell 变量需写 $$，${BROWSERLESS_TOKEN} 仍由解析期代入。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/pressure?token=${BROWSERLESS_TOKEN}" || true); [ "$$code" = "200" ] || [ "$$code" = "429" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── 合并 Host（单 Host 多角色）─────────────────────────────────────────────
  # 三个角色包装进同一个 profile：技能在各自 preset 层、persona 按 preset id 门控。
  # 派单只下发 kind；kit 按本机 worker.presetByKind 解析 preset，再按 项目号:preset 建会话。
  dsh-agent:
    image: ${DSH_MERGED_IMAGE:-dsh-agent-dev:local}
    build:
      context: ${DSH_DEV_SRC:-../agents/dsh-agent-dev}
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
        GH_VERSION: ${GH_VERSION:-2.95.0}
        GH_PROXY: ${DOCKER_PROXY:-}
    container_name: ${DSH_MERGED_CONTAINER_NAME:-dsh-agent}
    restart: unless-stopped
    depends_on:
      echuan:
        condition: service_healthy
      browserless:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 只发布 relay 的端口：harness 本身绑回环（DSH_BIND_HOST=loopback），
      # 所有外部访问都要过 relay 的 TLS + 密码/设备配对。
      # 默认绑 0.0.0.0 是为了手机等组网设备能连；只想本机用时改成
      # "127.0.0.1:${DSH_RELAY_PORT:-3443}:3443"。
      - "${DSH_RELAY_BIND:-0.0.0.0}:${DSH_RELAY_PORT:-3443}:3443"
    volumes:
      # dev 的角色需要指挥宿主 daemon（ADR-5：同进程特权，靠权限档位与红线约束）
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${HOST_PROJECT_PATH:?请在 .env 中设置项目绝对路径}:/workspace"
      - "${DSH_MERGED_HOME_DIR:-./data/dsh-home-agent}:/home/node/.dsh"
      # 共享资产库（只读）：/opt/agent-assets/<version>，由项目 .agent/assets.yaml pin
      - "${AGENT_ASSETS_SRC:-../../agent-assets}:/opt/agent-assets:ro"
      # 部署补丁层：registry.default=cto，并声明 worker 的 presetByKind
      - "./agents/dsh-agent.patch.yml:/home/node/.dsh/cordis.patch.yml:ro"
      # webhook 规则模块（home patch 里以 ./profiles/web/webhook/... 引用）
      - "./agents/webhook:/home/node/.dsh/profiles/web/webhook:ro"
      # 验收脚本（只读）：docker compose exec dsh-agent node /opt/verify-presets.mjs
    security_opt: *agent-security-opt
    cap_add: *agent-cap
    environment:
      <<: *agent-env
      PLUGIN_SPECS: ${DSH_MERGED_PLUGIN_SPECS:-dsh-agent-cto@0.7.1 dsh-agent-pm@0.7.1 dsh-agent-dev@0.8.2 dsh-echuan@0.5.1 dsh-agent-base@0.2.0 dsh-browser-native@0.1.0 dsh-local-admission@0.1.1 dsh-relay@0.4.0 @deepseek-ai/dsh-webhook@0.2.1-rc.2 @deepseek-ai/dsh-webhook-github@0.2.1-rc.2}
      # harness 只监听回环，对外只暴露 dsh-relay（TLS + 密码 + 设备配对）
      DSH_BIND_HOST: loopback
      DSH_RELAY_PORT: "3443"
      # GitHub webhook HMAC secret：dsh-webhook-github 按名字解析（env 回落）
      DSH_GITHUB_WEBHOOK_SECRET: ${DSH_GITHUB_WEBHOOK_SECRET:-}
      # 大小写代理变量必须成对覆盖：插件 HTTP 客户端读小写变量，
      # 注入的宿主代理会把访问驿传平台的请求转走 → 502。
      HTTP_PROXY: ${DOCKER_PROXY:-}
      HTTPS_PROXY: ${DOCKER_PROXY:-}
      ALL_PROXY: ${DOCKER_PROXY:-}
      http_proxy: ${DOCKER_PROXY:-}
      https_proxy: ${DOCKER_PROXY:-}
      all_proxy: ${DOCKER_PROXY:-}
    networks:
      - sanding
    logging: *default-logging
    # harness 绑回环后，探针必须走 127.0.0.1（探容器 eth0 IP 会一直失败）
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get({host:'127.0.0.1',port:3080,path:'/'},r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s


  # ── smee.io 中继客户端 ────────────────────────────────────────────────────
  # GitHub → https://smee.io/<channel> → 本进程 → 127.0.0.1:3080/github
  # harness 只绑回环（DSH_BIND_HOST=loopback），所以这里共享 dsh-agent 的
  # 网络命名空间：容器里 127.0.0.1 就是 harness 的 127.0.0.1。
  # 不共享会连不上，也不要给它加 ports（netns 共用，端口属于 dsh-agent）。
  smee:
    image: ${SMEE_IMAGE:-node:22-alpine}
    container_name: ${SMEE_CONTAINER_NAME:-dsh-smee}
    restart: unless-stopped
    network_mode: "service:dsh-agent"
    depends_on:
      dsh-agent:
        condition: service_started
    environment:
      SMEE_URL: ${SMEE_URL:?请在 .env 中设置 SMEE_URL（https://smee.io/<channel>）}
      SMEE_TARGET: ${SMEE_TARGET:-http://127.0.0.1:3080/github}
      # Docker Desktop 会把宿主代理注入容器（host.docker.internal:7890），
      # 但该地址在本容器网络里 ENETUNREACH → smee-client 一直 fetch failed，webhook 全丢。
      # smee 只需要访问 https://smee.io，容器内直连正常，这里显式清空代理。
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
    # 直接把值插进命令：compose 的 $$ 转义在 config 输出里仍是 $$，容易踩坑
    command: >
      npx --yes smee-client@5.0.0
      --url ${SMEE_URL:?请在 .env 中设置 SMEE_URL}
      --target ${SMEE_TARGET:-http://127.0.0.1:3080/github}
    logging: *default-logging

networks:
  sanding:
    name: sanding
    driver: bridge
