<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三鼎 · Agent 入口</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: #0f1115; color: #e8eaed; padding: 32px;
  }
  main { width: min(880px, 100%); }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: .02em; }
  p.lead { margin: 0 0 28px; color: #9aa0a6; font-size: 13px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  a.card {
    display: block; padding: 20px; border-radius: 12px; text-decoration: none;
    background: #171a21; border: 1px solid #262b34; color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.card:hover { border-color: #4c8dff; transform: translateY(-2px); }
  .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .role { font-size: 13px; color: #9aa0a6; }
  .url { margin-top: 14px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6ea8fe; }
  .hint { margin-top: 24px; font-size: 12px; color: #6b7280; }
  code { background: #1d222b; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>三鼎 · Agent 入口</h1>
  <p class="lead">每个入口都是一个独立的官方 dsh web，互不共享会话与工作区。</p>

  <div class="grid">
    <a class="card" href="http://cto.localhost:8080/">
      <div class="name">CTO</div>
      <div class="role">技术决策者：选型、架构审查、技术债</div>
      <div class="url">cto.localhost:8080</div>
    </a>
    <a class="card" href="http://dev.localhost:8080/">
      <div class="name">开发团队</div>
      <div class="role">Leader / Developer / Tester，按任务派单</div>
      <div class="url">dev.localhost:8080</div>
    </a>
    <a class="card" href="http://pm.localhost:8080/">
      <div class="name">产品经理</div>
      <div class="role">需求、验收标准、优先级</div>
      <div class="url">pm.localhost:8080</div>
    </a>
  </div>

  <p class="hint">
    子域打不开时改用 <code>http://127.0.0.1:8090</code> / <code>:8091</code> / <code>:8093</code>（直连各容器，等价入口）。
    三个 Agent 之间的协作走驿传，不需要在 UI 里切换。
  </p>
</main>
</body>
</html>
